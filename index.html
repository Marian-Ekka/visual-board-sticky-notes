<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Board - Refined Project</title>
   
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    
    <div class="app-container">
        
        
        <aside class="sidebar">
            <h2 class="sidebar-title">Visual Board</h2>
            <ul class="tool-list">
                <li><button id="add-btn" class="btn-primary">+ New Note</button></li>
                <li><button id="toggle-view-btn" class="btn-secondary">Table View</button></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="main-header">
                
                <h1 class="fancy-title">My Workspace</h1>
            </header>

           
            <div id="board" class="board-view"></div>
            <div id="table-view" class="table-container" style="display: none;">
                <table id="notes-table">
                    <caption>Summary of All Notes</caption>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Content</th>
                            <th>Color</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="script.js"></script> 
</body>
</html>
